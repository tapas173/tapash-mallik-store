apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapash-store
  namespace: tapash-store
  labels:
    app: tapash-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tapash-store
  template:
    metadata:
      labels:
        app: tapash-store
    spec:
      containers:
        - name: tapash-store
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }
